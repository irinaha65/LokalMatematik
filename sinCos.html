function getPolygon(a, b, angleA_deg) {


    // === Parametrar ==

    const angleA_rad = angleA_deg * Math.PI / 180;

    // === Cosinussatsen för att få tredje sidan ===
    const c = Math.sqrt(a ** 2 + b ** 2 - 2 * a * b * Math.cos(angleA_rad));

    // === Sinussatsen för att få övriga vinklar ===
    const sinB = (a * Math.sin(angleA_rad)) / c;

    const angleB_rad = Math.asin(Math.min(1, Math.max(-1, sinB)));

    const angleB_deg = angleB_rad * 180 / Math.PI;
    const angleC_deg = 180 - angleB_deg - angleA_deg;

    // === Triangelpunkter ===
    const Ax = 20, Ay = 200;
    const Bx = Ax + parseInt(a), By = Ay;
    const Cx = Ax + b * Math.cos(angleA_rad);
    const Cy = Ay - b * Math.sin(angleA_rad);

    polygon.corners = [{ x: Ax, y: Ay }, { x: Bx, y: By }, { x: Cx, y: Cy }
    ];
    polygon.angles = [angleA_deg, angleB_deg.toFixed(0), angleC_deg.toFixed(0)];
    polygon.lengths = [b, a, c.toFixed(2)];

    console.dir(polygon);



    //drawAll();

}

    const points = polygon.corners.map(p => ({
        x: p.x,
        y: p.y
    }));

    // ==========================================
    // 2. Hitta triangelns storlek
    // ==========================================

    const minX = Math.min(...points.map(p => p.x));
    const maxX = Math.max(...points.map(p => p.x));
    const minY = Math.min(...points.map(p => p.y));
    const maxY = Math.max(...points.map(p => p.y));

    const width = maxX - minX;
    const height = maxY - minY;

    // ==========================================
    // 3. Beräkna skala
    // ==========================================

    // Marginal runt triangeln
    const margin = 60;

    const scaleX = (canvasWidth - 2 * margin) / width;
    const scaleY = (canvasHeight - 2 * margin) / height;

    // Samma skala i båda riktningarna!
    const scale = Math.min(scaleX, scaleY);

    // ==========================================
    // 4. Omvandla till canvas-koordinater
    // ==========================================

    const scaledPoints = points.map(p => ({
        x: (p.x - minX) * scale + margin,

    }));

    // 5. Rita triangeln

if (txt !== "") {

// ==========================================
// Rita vinkelbåge
// ==========================================

function drawAngleArc(cx, cy, fromPt, toPt, label, color, offset = 20,angle) {

    const dx1 = fromPt.x - cx;
    const dy1 = fromPt.y - cy;

    const dx2 = toPt.x - cx;
    const dy2 = toPt.y - cy;

    const start = Math.atan2(dy1, dx1);
    const end = Math.atan2(dy2, dx2);

    // Beräkna den kortaste vinkeln mellan strålarna
    let delta = end - start;

    // Normalisera till -PI ... +PI
    while (delta > Math.PI) {
        delta -= 2 * Math.PI;
    }

    while (delta < -Math.PI) {
        delta += 2 * Math.PI;
    }

    const finalEnd = start + delta;

    const ctx = $("#canvas1")[0].getContext("2d");
 // ==========================================
    // 90 grader -> rita liten fyrkant
    // ==========================================

    if (Math.abs(angle - 90) < 0.5) {

        const size = offset;

        // Enhetsvektorer längs de två sidorna
        const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
        const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

        const ux1 = dx1 / len1;
        const uy1 = dy1 / len1;

        const ux2 = dx2 / len2;
        const uy2 = dy2 / len2;

        // Tre hörn på den lilla fyrkanten
        const p1 = {
            x: cx + ux1 * size,
            y: cy + uy1 * size
        };

        const p2 = {
            x: p1.x + ux2 * size,
            y: p1.y + uy2 * size
        };

        const p3 = {
            x: cx + ux2 * size,
            y: cy + uy2 * size
        };

        ctx.beginPath();

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);

        ctx.stroke();

        return;
    }

    ctx.beginPath();

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    // delta < 0 betyder moturs i canvasens koordinatsystem
    ctx.arc(
        cx,
        cy,
        offset,
        start,
        finalEnd,
        delta < 0
    );

    ctx.stroke();

    // =====================================
    // Text mitt i vinkeln
    // =====================================

    const midAngle = start + delta / 2;

    const tx = cx + (offset + 8) * Math.cos(midAngle);
    const ty = cy + (offset + 8) * Math.sin(midAngle);

    if (label) {
        ctx.fillStyle = color;
        ctx.font = "14px Arial";

        ctx.fillText(
            label,
            tx - 10,
            ty + 5
        );
    }
}
function drawDronareUppgift() {

    // === Grunddata ===
    const angleA_deg = 32;
    const angleB_deg = 47;
    const angleC_deg = 180 - angleA_deg - angleB_deg;

    const AB = 120;

    const canvas = $("#canvas2")[0];
    const ctx = canvas.getContext("2d");

    // === Skala ===
    const scale = 3;

    // === Punkter A och B ===
    const Ax = 50;
    const Ay = 250;

    const Bx = Ax + AB * scale;
    const By = Ay;

    // === Sinusberäkningar ===
    const angleA_rad = angleA_deg * Math.PI / 180;

    const sinC = Math.sin(angleC_deg * Math.PI / 180);
    const sinB = Math.sin(angleB_deg * Math.PI / 180);

    const AC = AB * sinB / sinC;
    const AC_scaled = AC * scale;

    let progress = 0;


    // ==========================================
    // Rita vinkelbåge
    // ==========================================

   function drawArcAtVertex(vertex, p1, p2, radius, color) {

    // Vektor 1
    let v1x = p1.x - vertex.x;
    let v1y = p1.y - vertex.y;

    // Vektor 2
    let v2x = p2.x - vertex.x;
    let v2y = p2.y - vertex.y;

    // Normalisera vektorerna
    const len1 = Math.sqrt(v1x * v1x + v1y * v1y);
    const len2 = Math.sqrt(v2x * v2x + v2y * v2y);

    v1x /= len1;
    v1y /= len1;

    v2x /= len2;
    v2y /= len2;

    // Vinkelbisektris
    let bx = v1x + v2x;
    let by = v1y + v2y;

    const blen = Math.sqrt(bx * bx + by * by);

    bx /= blen;
    by /= blen;

    // Riktningen för bisektrisen
    const middleAngle = Math.atan2(by, bx);

    // Själva vinkeln
    const dot = v1x * v2x + v1y * v2y;

    const angle = Math.acos(
        Math.max(-1, Math.min(1, dot))
    );

    // Börja halva vinkeln före bisektrisen
    const startAngle =
        middleAngle - angle / 2;

    // Sluta halva vinkeln efter bisektrisen
    const endAngle =
        middleAngle + angle / 2;

    // Rita bågen
    ctx.beginPath();

    ctx.arc(
        vertex.x,
        vertex.y,
        radius,
        startAngle,
        endAngle,
        false
    );

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
}


    // ==========================================
    // Animation
    // ==========================================

    function drawFrame() {

        // === Rensa canvas ===

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // ==========================================
        // Punkt C
        // ==========================================

        const curr_AC = AC_scaled * progress;

        const Cx =
            Ax +
            curr_AC * Math.cos(angleA_rad);

        const Cy =
            Ay -
            curr_AC * Math.sin(angleA_rad);


        // ==========================================
        // Rita triangeln
        // ==========================================

        ctx.beginPath();

        ctx.moveTo(Ax, Ay);
        ctx.lineTo(Bx, By);
        ctx.lineTo(Cx, Cy);
        ctx.closePath();

        ctx.strokeStyle = "blue";
        ctx.lineWidth = 2;

        ctx.stroke();


        // ==========================================
        // Höjdlinje
        // ==========================================

        ctx.beginPath();

        ctx.moveTo(Cx, Cy);
        ctx.lineTo(Cx, Ay);

        ctx.setLineDash([5, 5]);

        ctx.strokeStyle = "brown";
        ctx.lineWidth = 1;

        ctx.stroke();

        ctx.setLineDash([]);


        // ==========================================
        // VINKELBÅGAR
        // ==========================================

        if (progress > 0.15) {

            // Vinkel A = 32°
            drawArcAtVertex(
                { x: Ax, y: Ay },
                { x: Bx, y: By },
                { x: Cx, y: Cy },
                25,
                "green"
            );


            // Vinkel B = 47°
            drawArcAtVertex(
                { x: Bx, y: By },
                { x: Ax, y: Ay },
                { x: Cx, y: Cy },
                25,
                "red"
            );


        /*    // Vinkel C = 101°
            drawArcAtVertex(
                { x: Cx, y: Cy },
                { x: Ax, y: Ay },
                { x: Bx, y: By },
                25,
                "brown"
            );*/
        }


        // ==========================================
        // Hörn
        // ==========================================

        ctx.fillStyle = "black";
        ctx.font = "16px Arial";

        ctx.fillText(
            "A",
            Ax - 10,
            Ay + 20
        );

        ctx.fillText(
            "B",
            Bx + 5,
            By + 20
        );

    /*    ctx.fillText(
            "C",
            Cx + 5,
            Cy - 5
        );*/


        // ==========================================
        // Vinkel A
        // ==========================================

        ctx.fillStyle = "green";

        ctx.fillText(
            "32°",
            Ax + 40,
            Ay - 10
        );


        // ==========================================
        // Vinkel B
        // ==========================================

        ctx.fillStyle = "red";

        ctx.fillText(
            "47°",
            Bx - 45,
            By - 10
        );


        // ==========================================
        // Vinkel C
        // ==========================================
/*
        if (progress > 0.15) {

            ctx.fillStyle = "brown";

            ctx.fillText(
                angleC_deg.toFixed(0) + "°",
                Cx - 20,
                Cy + 30
            );
        }
*/

        // ==========================================
        // Höjd
        // ==========================================

     /*   const h =
            curr_AC *
            Math.sin(angleA_rad);

        ctx.fillStyle = "green";

        ctx.fillText(
            `h ≈ ${h.toFixed(1)} m`,
            Cx + 5,
            Cy + (Ay - Cy) / 2
        );

*/
        // ==========================================
        // Sidan AB
        // ==========================================

        ctx.fillStyle = "black";

        ctx.fillText(
            "120 m",
            (Ax + Bx) / 2 - 20,
            Ay + 20
        );


        // ==========================================
        // Nästa frame
        // ==========================================

        if (progress < 1) {

            progress += 0.01;

            idAnimation =
                requestAnimationFrame(drawFrame);
        }
    }


    // ==========================================
    // Starta animation
    // ==========================================

    drawFrame();
}
